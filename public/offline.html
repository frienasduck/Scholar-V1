<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05070d" />
    <title>Scholar — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #eef2ff; background: radial-gradient(circle at 50% 15%, #18223a 0, #090d17 38%, #03050a 78%); }
      main { width: min(100%, 440px); padding: 32px; text-align: center; border: 1px solid rgba(255,255,255,.16); border-radius: 28px; background: rgba(12,17,29,.72); box-shadow: 0 24px 80px rgba(0,0,0,.45), inset 0 1px rgba(255,255,255,.12); backdrop-filter: blur(18px); }
      img { width: 52px; height: 52px; }
      h1 { margin: 18px 0 8px; font-size: 1.5rem; }
      p { margin: 0; color: rgba(238,242,255,.68); line-height: 1.6; }
      a { display: inline-grid; min-height: 44px; margin-top: 24px; padding: 0 22px; place-items: center; color: #07101f; font-weight: 700; text-decoration: none; border-radius: 999px; background: #dbeafe; }
      a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="" />
      <h1>Scholar is offline</h1>
      <p>Reconnect to continue. Private study pages are never stored as offline copies on this device.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
